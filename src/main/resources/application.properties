spring.application.name=loan-api

# --- Database connection ---
# Secrets come from environment variables, never from this file.
spring.datasource.url=jdbc:postgresql://localhost:5432/loanapi
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# "validate": check Java entities against the real tables on startup.
# Flyway is the only thing allowed to create or change tables.
spring.jpa.hibernate.ddl-auto=validate

# --- Flyway ---
spring.flyway.enabled=true

# --- JWT ---
# JWT_SECRET is the key that signs tokens. Anyone who knows it can forge
# tokens, so it lives in an environment variable, not in Git.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=60

# --- Kafka ---
# Where the broker is (our local Docker container from docker-compose.kafka.yml).
spring.kafka.bootstrap-servers=localhost:9092
# "all" = wait until the broker confirms the message is safely stored.
spring.kafka.producer.acks=all
# If Kafka is unreachable, give up after 3 seconds instead of hanging the request.
spring.kafka.producer.properties.max.block.ms=3000
# A brand-new consumer group starts from the OLDEST message instead of only new ones.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=loan-scoring