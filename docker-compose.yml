# docker-compose runs several containers together as one system:
# PostgreSQL, Kafka, and our app.
services:

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: loanapi
      POSTGRES_USER: postgres
      # ":?" stops Compose with a clear message if the variable is not set.
      # The value comes from your terminal ($env:DB_PASSWORD), never from this file.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in this terminal first}
    ports:
      # Host port 5433 -> container port 5432. We use 5433 so it does not
      # clash with the PostgreSQL already installed on your laptop (5432).
      - "5433:5432"
    volumes:
      # Named volume: the data survives container restarts.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Reports "healthy" only when the database accepts connections.
      test: ["CMD-SHELL", "pg_isready -U postgres -d loanapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    # One Kafka broker in KRaft mode (Kafka manages itself, no ZooKeeper).
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      # The address other containers use to reach Kafka: the service name "kafka".
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # One broker only, so every internal topic needs just one copy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Smaller memory use, because Docker Desktop on this laptop has limited RAM.
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    # No "ports:" here on purpose: only other containers talk to this Kafka, and it
    # will not clash with the Kafka you start by hand on port 9092.
    healthcheck:
      # Healthy only when the broker answers a real request.
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  app:
    build: .
    depends_on:
      db:
        # Start the app only after the database is healthy.
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      # Spring maps SPRING_DATASOURCE_URL to spring.datasource.url and
      # overrides application.properties. "db" is the service name above:
      # containers on the same Compose network reach each other by name.
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/loanapi
      SPRING_DATASOURCE_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in this terminal first}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in this terminal first}
      # Same idea for Kafka: the service name "kafka", not localhost.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8080:8080"

volumes:
  pgdata: