spring.application.name=loan-api

# --- Database connection ---
# The password is NOT written here. It is read from an environment
# variable called DB_PASSWORD so it never gets committed to GitHub.
spring.datasource.url=jdbc:postgresql://localhost:5432/loanapi
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
# "validate" means: on startup, check that our Java entities match the
# real tables, and fail loudly if they do not. Flyway (not Hibernate)
# is the only thing allowed to create or change tables.
spring.jpa.hibernate.ddl-auto=validate

# --- Flyway ---
# Runs the SQL files in src/main/resources/db/migration on startup.
spring.flyway.enabled=true